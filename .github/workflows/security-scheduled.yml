name: Scheduled Security Scan

on:
  schedule:
    # 03:30 UTC daily — staggered from the other Feedbakkr repos so the org's
    # overall scan window is spread out.
    - cron: "30 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security-scan:
    name: Scheduled security scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ".nvmrc"
          cache: npm
      - run: npm ci

      - name: Native dependency audit (moderate+)
        run: npm audit --audit-level=moderate
        continue-on-error: true

      - name: Install OSV-Scanner
        run: |
          curl -sSfL https://raw.githubusercontent.com/google/osv-scanner/main/install.sh \
            | sh -s -- -b /usr/local/bin

      - name: Run OSV-Scanner (JSON report)
        run: osv-scanner --recursive --format=json --output=osv-report.json .
        continue-on-error: true

      - name: Run OSV-Scanner (human-readable summary)
        if: always()
        run: osv-scanner --recursive .
        continue-on-error: true

      - name: Upload OSV report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: osv-report
          path: osv-report.json
          retention-days: 30
          if-no-files-found: ignore
